<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Student Success AI{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body {% block bodyattrs %}{% endblock %}>
<header><div class="w">
<div class="top"><a class="brand" href="/"><img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="28" height="28">Student Success AI</a>
{% block topright %}{% endblock %}</div>
{% block nav %}{% endblock %}
</div></header>
<main><div class="w" id="app">{% block content %}{% endblock %}</div></main>
<footer><div class="w"><a href="/privacy">Privacy policy</a><a href="/terms">Terms and conditions</a>
<p>Student Analytics &amp; Success Platform · Flask + SQLite</p></div></footer>
{% block scripts %}{% endblock %}
</body>
</html>
